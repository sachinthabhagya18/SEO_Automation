services:
  metadata-test-worker:
    profiles: [wp-test]
    build:
      context: .
      dockerfile: infra/Dockerfile
    env_file: .env
    environment:
      CONNECTOR_LOCAL_FIXTURE_ENABLED: 'true'
      LOCAL_PUBLICATION_ENABLED: 'true'
    command: [celery, -A, config, worker, --loglevel=INFO, --concurrency=1, -Q, metadata-fixture, '--hostname=metadata-fixture@%h']
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    init: true
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'celery -A config inspect ping -d metadata-fixture@$$HOSTNAME --timeout=5 | grep -q pong']
      interval: 15s
      timeout: 10s
      retries: 8
  wp-db:
    image: mariadb:11.4.8
    profiles: [wp-test]
    environment:
      MARIADB_DATABASE: wordpress_fixture
      MARIADB_USER: wordpress_fixture
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:?Run scripts/wordpress-fixture.ps1}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:?Run scripts/wordpress-fixture.ps1}
    volumes: [wp_db_data:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:7.1.4-php8.3-apache
    profiles: [wp-test]
    ports: ['127.0.0.1:8081:80']
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wordpress_fixture
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress_fixture
      WP_FIXTURE_ADMIN_PASSWORD: ${WP_FIXTURE_ADMIN_PASSWORD:?Run scripts/wordpress-fixture.ps1}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('CSEO_ALLOW_INSECURE_LOCAL', true);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wp_data:/var/www/html
      - ./wordpress-plugin/company-seo-connector:/var/www/html/wp-content/plugins/company-seo-connector:ro
      - ./tests/fixtures/wordpress:/fixtures:ro
      - ./tests/fixtures/synthetic-theme:/var/www/html/wp-content/themes/synthetic-seo:ro
    depends_on:
      wp-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1/wp-includes/css/dashicons.min.css') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  wp_db_data:
  wp_data:
