name: seo_automation
x-app: &app
  build:
    context: .
    dockerfile: infra/Dockerfile
  env_file: .env
  volumes:
    - uploads:/data/uploads
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  init: true
  security_opt: [no-new-privileges:true]
services:
  db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/setup.ps1}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup.ps1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: [python, manage.py, migrate, --noinput]
    restart: 'no'
  web:
    <<: *app
    restart: unless-stopped
    command: [python, manage.py, runserver, '0.0.0.0:8000', --noreload]
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    restart: unless-stopped
    command: [celery, -A, config, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, 'celery -A config inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong']
      interval: 30s
      timeout: 10s
      retries: 5
  staging-publisher:
    <<: *app
    profiles: [staging-publish]
    command: [celery, -A, config, worker, --loglevel=INFO, --concurrency=1, -Q, metadata-staging, --hostname=staging-publisher@%h]
    environment:
      LOCAL_PUBLICATION_ENABLED: 'false'
      CONNECTOR_LOCAL_FIXTURE_ENABLED: 'false'
    restart: unless-stopped
  n8n-db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Run scripts/setup.ps1}
    volumes: [n8n_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U n8n -d n8n]
      interval: 5s
      timeout: 3s
      retries: 20
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.7
    restart: unless-stopped
    ports: ['127.0.0.1:5679:5678']
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run scripts/setup.ps1}
      GENERIC_TIMEZONE: Asia/Colombo
      TZ: Asia/Colombo
      N8N_SECURE_COOKIE: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
    volumes: [n8n_data:/home/node/.n8n]
    depends_on:
      n8n-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
  redis_data:
  uploads:
  n8n_postgres_data:
  n8n_data:
